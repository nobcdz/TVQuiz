<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVQuiz · 电视魔改答题系统 · 家长管理</title>
<link rel="stylesheet" href="/admin/assets/panel.css">
<link rel="stylesheet" href="/admin/assets/vendor/katex/katex.min.css">
<script defer src="/admin/assets/vendor/katex/katex.min.js"></script>
<script defer src="/admin/assets/vendor/katex/contrib/auto-render.min.js"></script>
<script defer src="/admin/assets/math.js"></script>
<script defer src="/admin/assets/panel.js"></script>
</head>
<body>
<header><small>TVQuiz · 电视魔改答题系统</small><h1>家长管理</h1><p id="device">连接电视后，管理孩子的观看和答题计划。</p></header>
<main>
<p id="notice" role="status" hidden></p>
<form id="login" class="card">
<h2>登录电视</h2>
<label>电视地址<input id="tvAddress" readonly></label>
<label>管理密码<input name="passphrase" type="password" autocomplete="current-password"></label>
<button>登录</button>
</form>
<section id="panel" hidden>
<div class="toolbar"><label>管理档案<select id="profile"></select></label><button id="logout" type="button">退出登录</button></div>
<nav aria-label="管理分类" id="tabs">
<button data-tab="settings" aria-pressed="true">观看设置</button><button data-tab="questions" aria-pressed="false">题库管理</button><button data-tab="records" aria-pressed="false">使用记录</button>
</nav>
<section id="settings">
<form class="card" id="family"><h2>孩子档案</h2><div class="fields" id="familyFields"></div><button>保存档案</button></form>
<form class="card" id="config"><h2>观看规则与课程进度</h2><div class="fields" id="configFields"></div><button>保存观看规则</button></form>
</section>
<section id="questions" hidden>
<section class="card" aria-labelledby="bankCountTitle">
<h2 id="bankCountTitle">题量总览</h2><p id="bankTotal" aria-live="polite"></p>
<div class="bank-counts" id="bankCounts"></div>
</section>
<form class="card" id="filter"><h2>题库</h2><div class="fields" id="filters"></div><button>查看题目</button> <button type="button" id="exportBank">导出筛选题库</button> <button type="button" id="useGrade">设为出题年级</button></form>
<form class="card" id="question"><h2>新增或编辑单选题</h2><div class="fields" id="questionFields"></div><button>保存题目</button> <button type="reset">清空</button></form>
<form class="card" id="import"><h2>批量导入</h2><label>题库 JSON 文件<input name="file" type="file" accept=".json,application/json"></label><label>或粘贴 JSON 数组<textarea name="json" rows="4"></textarea></label><button>导入题目</button></form>
<div id="questionList"></div>
</section>
<section id="records" hidden>
<div class="card"><h2>近七日记录</h2><div id="history"></div></div>
<div class="card"><h2>最近活动</h2><div id="events"></div></div>
</section>
</section>
</main>
</body>
</html>
